{% extends 'base.html' %}

{% block title %}コンディション判定結果 - WORK STATUS{% endblock %}

{% block content %}
    <h1>コンディション判定結果</h1>

    <!-- 判定結果のアラートボックス（警告・要休息カラー） -->
    <div style="background:#fff3cd; padding:15px; border-radius:4px; border:1px solid #ffeeba; margin-bottom: 20px;">
        <h2 style="border:none; margin-top:0; color:#856404;">AI判定: 要休息</h2>
        <p style="margin-bottom: 0; color: #856404;">睡眠時間が不足気味です。無理をせず適宜休憩を取るようにしてください。</p>
    </div>

    <h3>入力内容</h3>
    <ul>
        <li>出勤時間: 9:00</li>
        <li>睡眠時間: 4.0時間</li>
        <li>体調: 悪い</li>
        <li>気分: 落ち込んでいる</li>
    </ul>

    <div class="nav-links" style="display: flex; align-items: center; gap: 20px;">
        <a href="#">編集する</a>
        <a href="{% url 'wsapp:03-top' %}" class="btn">トップへ戻る</a>
    </div>
{% endblock %}
