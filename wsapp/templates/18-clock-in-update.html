{% extends 'base.html' %}

{% block title %}打刻時間編集 - WORK STATUS{% endblock %}

{% block content %}
    <h1>打刻時間編集</h1>
    
    <form action="" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="emp_name">従業員名</label>
            <input type="text" id="emp_name" name="emp_name" value="{{ record.employee.full_name|default:record.employee }}" readonly style="background-color: #e9ecef;">
        </div>

        <div class="form-group">
            <label for="work_date">対象日</label>
            <input type="date" id="work_date" name="work_date" value="{{ record.working_date|date:'Y-m-d' }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="clock_in">出勤時間</label>
                <input type="time" id="clock_in" name="clock_in" value="{{ record.clock_in|date:'H:i' }}" required>
            </div>
            <div class="form-group">
                <label for="clock_out">退勤時間</label>
                <input type="time" id="clock_out" name="clock_out" value="{{ record.clock_out|date:'H:i' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="reason">変更理由（管理者メモ）</label>
            <textarea id="reason" name="reason" placeholder="直行直帰のため、打刻忘れ修正のため、など理由を入力してください" style="resize: vertical; height: 80px; font-family: sans-serif;">{{ record.change_reason }}</textarea>
        </div>

        <button type="submit" class="btn">打刻時間を変更する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
