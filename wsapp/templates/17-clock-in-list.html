{% extends 'base.html' %}

{% block title %}打刻時間一覧 - WORK STATUS{% endblock %}

{% block content %}
    <h1>打刻時間一覧</h1>
    <div class="filter-area">
        <div>
            <label for="target_date">対象日:</label>
            <input type="date" id="target_date" value="2026-10-19">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>従業員名</th>
                <th style="width: 120px;">対象日</th>
                <th style="width: 100px;">出勤時間</th>
                <th style="width: 100px;">退勤時間</th>
                <th style="width: 70px; text-align: center;">打刻時間</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>大原 太郎</td>
                <td>2026/10/19</td>
                <td>09:00</td>
                <td>18:00</td>
                <td style="text-align: center;">
                    <a href="{% url 'wsapp:18-clock-in-update' %}" class="btn-sm">編集</a>
                </td>
            </tr>
            <tr>
                <td>山田 太郎</td>
                <td>2026/10/19</td>
                <td>--:--</td>
                <td>--:--</td>
                <td style="text-align: center;">
                    <a href="{% url 'wsapp:18-clock-in-update' %}" class="btn-sm">編集</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
