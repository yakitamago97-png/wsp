{% extends 'base.html' %}

{% block title %}タスク登録 - WORK STATUS{% endblock %}

{% block content %}
    <h1>タスク登録</h1>
    
    <form action="#" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="task_name">タスク名</label>
            <input type="text" id="task_name" name="task_name" required>
        </div>
        
        <div class="form-group">
            <label for="assignee">担当者</label>
            <select id="assignee" name="assignee" required>
                <option value="" disabled selected>選択してください</option>
                <option value="001">大原 太郎</option>
                <option value="002">山田 太郎</option>
            </select>
        </div>

        <div class="form-group">
            <label for="deadline">期限</label>
            <input type="date" id="deadline" name="deadline" required>
        </div>

        <!-- 詳細内容 -->
        <div class="form-group">
            <label for="detail">詳細内容</label>
            <textarea id="detail" name="detail" placeholder="タスクの具体的な内容や手順を入力してください" style="resize: vertical; height: 100px; font-family: sans-serif;"></textarea>
        </div>

        <button type="submit" class="btn">登録する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
