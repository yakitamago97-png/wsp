{% extends 'base.html' %}

{% block title %}パスワード変更 - WORK STATUS{% endblock %}

{% block content %}
    <h1>パスワード変更</h1>
    
    <form action="#" method="POST">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="current_password">現在のパスワード（または仮パスワード）</label>
            <input type="password" id="current_password" name="current_password" placeholder="現在のパスワードを入力" required>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="new_password">新しいパスワード</label>
            <input type="password" id="new_password" name="new_password" placeholder="新しいパスワードを入力" required>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="new_password_confirm">新しいパスワード（確認）</label>
            <input type="password" id="new_password_confirm" name="new_password_confirm" placeholder="もう一度新しいパスワードを入力" required>
        </div>

        <button type="submit" class="btn">パスワードを更新する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
