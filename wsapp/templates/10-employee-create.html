{% extends 'base.html' %}

{% block title %}従業員登録 - WORK STATUS{% endblock %}

{% block extra_css %}
<style>
    .password-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .password-row input {
        flex: 1;
        font-family: monospace;
    }

    .btn-sub {
        background: #fff;
        color: #2c3e50;
        border: 1px solid #ccc;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
    }

    .btn-sub:hover {
        background: #f4f6f8;
    }

    .copy-status {
        margin-top: 4px;
        font-size: 12px;
        color: #27ae60;
        min-height: 18px;
    }
</style>
{% endblock %}

{% block content %}
    <h1>従業員登録</h1>
    
    <form action="{% url 'wsapp:10-employee-create' %}" method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="last_name">姓</label>
                <input type="text" id="last_name" name="last_name" placeholder="例: 山田" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="first_name">名</label>
                <input type="text" id="first_name" name="first_name" placeholder="例: 太郎" autocomplete="off" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="例: yamada@example.com" autocomplete="off" required>
        </div>

        <div class="form-group">
            <label for="password">仮パスワード</label>
            <div class="password-row">
                <input
                    type="text"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    spellcheck="false"
                    required
                >
                <button type="button" id="regen-password-btn" class="btn-sub">再生成</button>
                <button type="button" id="copy-password-btn" class="btn-sub">コピー</button>
            </div>
            <div id="copy-status" class="copy-status" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="role">権限</label>
            <select id="role" name="role">
                <option value="general">一般</option>
                <option value="admin">管理者</option>
            </select>
        </div>
        
        <button type="submit" class="btn">登録する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const regenBtn = document.getElementById('regen-password-btn');
        const copyBtn = document.getElementById('copy-password-btn');
        const copyStatus = document.getElementById('copy-status');

        function generateTempPassword(length = 12) {
            const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const lower = 'abcdefghijkmnpqrstuvwxyz';
            const digits = '23456789';
            const symbols = '!@#$%&*';
            const allChars = upper + lower + digits + symbols;

            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);

            const chars = [
                upper[randomValues[0] % upper.length],
                lower[randomValues[1] % lower.length],
                digits[randomValues[2] % digits.length],
                symbols[randomValues[3] % symbols.length],
            ];

            for (let i = 4; i < length; i++) {
                chars.push(allChars[randomValues[i] % allChars.length]);
            }

            for (let i = chars.length - 1; i > 0; i--) {
                const j = randomValues[i % randomValues.length] % (i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            return chars.join('');
        }

        function clearEmailIfNotEdited() {
            if (emailInput && !emailInput.dataset.userEdited) {
                emailInput.value = '';
            }
        }

        function initPasswordIfNotEdited() {
            if (passwordInput && !passwordInput.dataset.userEdited) {
                passwordInput.value = generateTempPassword(12);
            }
        }

        clearEmailIfNotEdited();
        initPasswordIfNotEdited();

        setTimeout(() => {
            clearEmailIfNotEdited();
            initPasswordIfNotEdited();
        }, 60);

        window.addEventListener('pageshow', () => {
            clearEmailIfNotEdited();
            initPasswordIfNotEdited();
        });

        if (emailInput) {
            emailInput.addEventListener('input', () => {
                emailInput.dataset.userEdited = 'true';
            });
        }

        if (passwordInput) {
            passwordInput.addEventListener('input', () => {
                passwordInput.dataset.userEdited = 'true';
            });
        }

        if (regenBtn && passwordInput) {
            regenBtn.addEventListener('click', () => {
                passwordInput.value = generateTempPassword(12);
                passwordInput.dataset.userEdited = 'true';
                if (copyStatus) {
                    copyStatus.textContent = '新しい仮パスワードを生成しました。';
                }
            });
        }

        if (copyBtn && passwordInput) {
            copyBtn.addEventListener('click', async () => {
                if (!passwordInput.value) return;
                try {
                    await navigator.clipboard.writeText(passwordInput.value);
                    if (copyStatus) {
                        copyStatus.textContent = '仮パスワードをコピーしました。';
                    }
                } catch (err) {
                    passwordInput.select();
                    document.execCommand('copy');
                    if (copyStatus) {
                        copyStatus.textContent = '仮パスワードをコピーしました。';
                    }
                }
            });
        }
    });
</script>
{% endblock %}
