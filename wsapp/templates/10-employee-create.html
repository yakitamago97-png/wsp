{% extends 'base.html' %}

{% block title %}従業員登録 - WORK STATUS{% endblock %}

{% block content %}
    <h1>従業員登録</h1>
    
    <form action="#" method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="last_name">姓</label>
                <input type="text" id="last_name" name="last_name" placeholder="例: 山田" required>
            </div>
            <div class="form-group">
                <label for="first_name">名</label>
                <input type="text" id="first_name" name="first_name" placeholder="例: 太郎" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="例: yamada@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">仮パスワード</label>
            <input type="password" id="password" name="password" placeholder="パスワードを入力してください" required>
        </div>

        <div class="form-group">
            <label for="role">権限</label>
            <select id="role" name="role">
                <option value="general">一般</option>
                <option value="admin">管理者</option>
            </select>
        </div>
        
        <button type="submit" class="btn">登録する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
