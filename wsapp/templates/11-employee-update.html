{% extends 'base.html' %}

{% block title %}従業員編集 - WORK STATUS{% endblock %}

{% block content %}
    <h1>従業員編集</h1>
    
    <form action="{% url 'wsapp:11-employee-update' employee.pk %}" method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="last_name">姓</label>
                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    value="{{ initial_last_name }}"
                    required
                >
            </div>
            <div class="form-group">
                <label for="first_name">名</label>
                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    value="{{ initial_first_name }}"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="role">権限</label>
            <select id="role" name="role">
                <option value="general" {% if not is_admin %}selected{% endif %}>一般</option>
                <option value="admin" {% if is_admin %}selected{% endif %}>管理者</option>
            </select>
        </div>
        
        <button type="submit" class="btn">更新する</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'wsapp:03-top' %}">トップへ戻る</a>
    </div>
{% endblock %}
