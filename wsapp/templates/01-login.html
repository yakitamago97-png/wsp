{% extends 'base.html' %}

{% block title %}ログイン - WORK STATUS{% endblock %}

{% block content %}
    <h1>ログイン</h1>
    
    <form id="login-form" action="{% url 'wsapp:01-login' %}" method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="form-group">
            <label for="emp_id">従業員ID</label>
            <input
                type="text"
                id="emp_id"
                name="emp_id"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div style="display: flex; align-items: center; gap: 15px; margin-top: 20px;">
            <button type="submit" class="btn" style="font-size: 16px;">ログイン</button>
            <p style="font-size: 13px; color: #666; margin: 0;">パスワードをお忘れの方は、システム管理者までお問い合わせ下さい。</p>
        </div>
    </form>
{% endblock %}

{% block extra_js %}
<script>
    function clearLoginFields() {
        const empIdInput = document.getElementById('emp_id');
        const passwordInput = document.getElementById('password');
        if (empIdInput) empIdInput.value = '';
        if (passwordInput) passwordInput.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        clearLoginFields();
        setTimeout(clearLoginFields, 50);

        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', () => {
                setTimeout(clearLoginFields, 0);
            });
        }
    });

    window.addEventListener('pageshow', clearLoginFields);
</script>
{% endblock %}
